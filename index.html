<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme">
    <div class="dashboard-container">
        <header>
            <div class="header-left">
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme">☀️</button>
                <h1>Trading Console</h1>
            </div>
            <div class="controls">
                <input type="file" id="file-import" accept=".json" style="display: none;">
                <button id="import-btn" class="action-btn">Import JSON</button>
            </div>
            <div class="summary-stats">
                <div class="stat-box"  onClick="renderHeatmap()">My Net P/L: <span id="my-total-pnl">0.00</span></div>
                <div class="stat-box" onClick="renderHeatmap('guruji')">Guriji Net P/L: <span id="guriji-total-pnl">0.00</span></div>
            </div>

            
        </header>

        <section id="heatmap-container" class="glass-panel" style="padding: 1.5rem; overflow-x: visible;">
        </section>

        <section class="glass-panel">
            <table id="data-table">
                <thead>
                 
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
